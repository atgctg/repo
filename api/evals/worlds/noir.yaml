title: Rain City
events:
  - type: card
    name: Style
    attributes:
      Style: Graphic noir illustration, heavy ink shadows
      Palette: Deep blues, sodium orange streetlight
  - type: card
    name: Vale
    cover: Vale
    attributes:
      Role: Private detective, retired
      Look: Tall, gaunt, grey stubble, wrinkled trench coat, loosened black tie
  - type: card
    name: Rosa Delgado
    cover: Rosa Delgado
    attributes:
      Role: Widow, client
      From: Chicago
      Look: Late 30s, black bob, red lipstick, dark green dress, pearl earrings
  - type: image
    name: Office Wide
    prompt:
      Shot: A wide shot at eye level of a cramped detective office.
      Setting: A small office at night, with rain streaking a window behind the desk, a single desk lamp throwing hard yellow light, and deep shadows in the corners.
      Subjects:
        Vale: A tall, gaunt man with grey stubble in a wrinkled trench coat and loosened black tie, sitting behind the desk screen-left and facing right.
        Rosa Delgado: A woman in her late thirties with a black bob, red lipstick, a dark green dress, and pearl earrings, standing in the doorway screen-right and facing left.
  - type: image
    name: Rosa At Desk
    prompt:
      Shot: A medium close-up at eye level of the client across the desk.
      Setting: The detective office at night, with the desk lamp lighting her face from below and rain on the window behind her.
      Subjects:
        Rosa Delgado: A woman in her late thirties with a black bob, red lipstick, a dark green dress, and pearl earrings, seated center and facing the camera with a tense, steady look.
  - type: dialogue
    background: Rosa At Desk
    speaker: Rosa Delgado
    caption: You're the only one in this city who can find him.
