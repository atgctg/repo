  - type: video
    name: Tipping The Crunchies
    prompt:
      Action: 'Second 0 to 1: Cat approaches the ceramic food bowl. Second 1 to 3: A
        furry cat paw bats and flips the ceramic bowl upside down, scattering
        kibble across the hardwood floor. Second 3 to 5: In the background, the
        human jumps back, leans down into view pointing at the floor, shouting
        Hey! What are you doing?!'
      Audio: Loud ceramic bowl flipping and clattering on the floor, kibble bouncing
        across wood floorboards, human shouting Hey! What are you doing?!, no
        music.
      Camera: Floor-level first-person perspective, low-angle view looking upward at
        the startled human.
      Environment: Sunlit kitchen with polished wooden floor and tall cabinetry.
      Lighting: Natural soft morning kitchen light.
      Subject: First-person cat POV looking at a ceramic bowl of cat crunchies on a
        rubber mat, with human legs standing in background.
