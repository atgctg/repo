meta:
  id: night-market
  createdAt: 2026-09-15T20:50:00.000Z
  updatedAt: 2026-09-15T20:50:00.000Z
slides:
  - background: Market Gate
  - speaker: Vendor
    dialogue: Lanterns first. Then the smell of oil and rain.
  - dialogue: Stay close.
  - background: Noodle Stall
  - dialogue: One bowl. Extra chili.
  - background: Alley Rain
  - speaker: Courier
    dialogue: Package for the roof.
  - background: Rooftop Radio
  - dialogue: The city never really sleeps.
  - background: Paper Lanterns
media:
  - type: image
    name: Market Gate
    prompt:
      Description: A crowded night-market entrance under a weathered wooden arch,
        strings of warm paper lanterns, wet stone, steam, bikes parked to one
        side.
    createdAt: 2026-09-15T20:50:00.000Z
    key: /media/night-market/market-gate.jpg
  - type: image
    name: Noodle Stall
    prompt:
      Description: A tight food stall at night, copper pots, a cook tossing noodles in
        a wok, hanging tickets, neon reflecting in oil.
    createdAt: 2026-09-15T20:50:00.000Z
    key: /media/night-market/noodle-stall.jpg
  - type: image
    name: Alley Rain
    prompt:
      Description: A narrow back alley in heavy rain, a scooter courier in a yellow
        jacket, puddles, distant market glow at the far end.
    createdAt: 2026-09-15T20:50:00.000Z
    key: /media/night-market/alley-rain.jpg
  - type: image
    name: Rooftop Radio
    prompt:
      Description: A rooftop above the market, old radio mast, laundry lines, a person
        sitting with headphones, city lights going to the horizon.
    createdAt: 2026-09-15T20:50:00.000Z
    key: /media/night-market/rooftop-radio.jpg
  - type: image
    name: Paper Lanterns
    prompt:
      Description: Close-up of overlapping red and amber paper lanterns filling the
        frame, slight wind, rain beads on the paper, night sky behind.
    createdAt: 2026-09-15T20:50:00.000Z
    key: /media/night-market/paper-lanterns.jpg
  - type: image
    name: Vendor
    prompt:
      Description: An older stall vendor in a canvas apron, half-smile, steam and
        lantern light on their face, market crowd soft in the background.
    createdAt: 2026-09-15T20:50:00.000Z
cards:
