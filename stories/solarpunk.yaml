cards:
  - name: Style
    attributes:
      Atmosphere: Bright, clear sunlit daylight with vibrant contrast and clean
        solarpunk mood
      Medium: Painterly digital illustration with expressive brushstrokes and bold
        graphic color shapes
      Palette: Saturated cerulean blues, warm golden yellows, olive greens, and crisp
        whites
      Rendering: Flat graphic aesthetic, painterly textures, strictly avoiding
        photorealism or 3D rendered appearance
  - name: Botanist
    attributes:
      Appearance: Olive-green loose linen buttoned overshirt over an unbleached beige
        cotton crewneck undershirt; dark charcoal canvas utility trousers with
        brass riveted cargo pockets; heavy brown leather field boots with brass
        buckles; brass-framed steampunk goggles with dark amber lenses pushed up
        resting on forehead; leather shoulder strap running diagonally across
        chest from left shoulder to right hip supporting a worn tan canvas
        satchel with brass clasp
      Hair: Glossy raven-black hair tied in a single neat three-strand braid resting
        over her right shoulder with loose wisps around temples
      Physical: 26-year-old female botanist, sun-warmed tan skin, clear brown
        almond-shaped eyes, slight dusting of freckles over bridge of nose, warm
        friendly smile
  - name: Traveler
    attributes:
      Appearance: Wide-brimmed flat-topped dark charcoal wool felt hat with thin
        leather hatband; ankle-length dark charcoal-grey heavy canvas duster
        coat with deep turned-down collar worn open; slate-grey collarless
        homespun linen button-up shirt underneath; charcoal rugged trail
        trousers tucked into tall lace-up weathered dark brown leather travel
        boots; dark leather cross-body strap carrying a rolled wool bedroll;
        holds a 5-foot smooth ash-wood surveyor walking staff capped with a
        polished brass circular astrolabe dial
      Facial: 38-year-old solitary wanderer, pale olive weathered skin with faint
        laugh lines around dark squinting eyes, three-day salt-and-pepper
        stubble across jaw and chin
