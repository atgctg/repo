rule: 'Name an image for the reusable shot: who is in frame, where, and the
  angle. Do not name the moment. Reuse an existing image for dialogue when that
  shot can carry the line. Create a new image only when no existing shot shows
  the people, place, or framing you need.'
expect: Leo's dialogue keeps the user's point about last year and checking the
  phone. Lines sit on shots that already exist. At most one new image.
pass:
  - kind: dialogue
    speaker: Leo
    has: last year
  - kind: max_images
    n: 1
