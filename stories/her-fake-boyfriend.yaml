id: her-fake-boyfriend
title: Her Fake Boyfriend
createdAt: 2026-09-15T21:31:43.922Z
updatedAt: 2026-09-18T12:28:00.596Z
slides:
  - background: Tenno Sushi
  - background: Keiko
    speaker: Keiko
    dialogue: So, Yuki... when are we finally meeting him?
  - background: Yuki
    speaker: Yuki
    dialogue: "*Chopsticks stop halfway to the plate.*"
  - background: Haruma
    speaker: Haruma
    dialogue:
      - Your boyfriend.
      - The one who has apparently been keeping our daughter in America.
  - background: Eyes Lock On You
    dialogue: "*Eyes dart frantically around the restaurant until they lock onto you
      passing by.*"
  - background: The Arm Grab
    speaker: Yuki
    dialogue: "*Stands up and catches your sleeve.*"
  - background: POV There You Are
    speaker: Yuki
    dialogue: There you are! Mom, Dad... this is my boyfriend!
  - background: Whispering In Your Ear
    speaker: Yuki
    dialogue:
      - "*Leans in close to your ear*"
      - Please. Pretend you're my boyfriend.
      - I told them we've been together for eight months.
  - background: Leo's Introduction
    speaker: Leo
    dialogue:
      - "*Nods*"
      - Riiight, it's nice to finally meet you all! I'm Leo!
  - background: Eyes Lock On You
    speaker: Yuki
    dialogue:
      - "*Exhales in relief*"
      - Yes! See, Mom? I told you he wasn't standing us up!
  - background: Parents Reaction
    speaker: Keiko
    dialogue: Oh my goodness! Leo! Sit down, sit down!
  - background: Haruma
    speaker: Haruma
    dialogue:
      - Leo, is it? Eight months, and she's only just showing you off.
  - background: Leo Awkward Laugh
    speaker: Leo
    dialogue:
      - Well.. You all live so far away..
      - "*Laughs nervously*"
  - background: Yuki
    speaker: Yuki
    dialogue:
      - "*Squeezes your hand fiercely under the table*"
      - Tokyo isn't that far, silly! But he works so hard, Dad.
  - background: Leo Exclaims at Yuki
    speaker: Leo
    dialogue:
      - "*Stares incredulously at Yuki*"
      - Not that far?! From LA? Are you crazy?
  - background: Parents Stunned Silence
    speaker: Keiko
    dialogue:
      - "*Blinks*"
      - LA...? Yuki, didn't you say he lived across town in Shibuya?
  - background: Yuki
    speaker: Yuki
    dialogue:
      - "*Kicks Leo under the table*"
      - Little America! He means the diner in Shibuya, right honey?!
  - background: Haruma Eyeing Them
    speaker: Haruma
    dialogue:
      - "*Narrows eyes*"
      - Is that what you meant, Leo? Los Angeles or a diner?
  - background: Leo Digs Deeper Hole
    speaker: Leo
    dialogue:
      - Wait, you also live in Tokyo?
      - I thought you moved here with her... uh recently!
  - background: Parents Stunned Silence
    speaker: Haruma
    dialogue:
      - "*Haruma frowns*"
      - We live in Sapporo, Leo.
      - We took a twelve-hour flight just to see her.
  - background: Whispering In Your Ear
    speaker: Yuki
    dialogue:
      - "*Leans in to whisper*"
      - Sapporo! They live in Hokkaido!
      - Stop guessing before you kill me!
  - background: Leo Whispering
    speaker: Leo
    dialogue:
      - "*Whispers back*"
      - What do you mean? Which is it?
      - Sapporo or Hokkaido?
  - background: Whispering In Your Ear
    speaker: Yuki
    dialogue:
      - "*Pinches bridge of nose*"
      - Sapporo is the capital city of Hokkaido..
      - It's the same place you idiot!
  - background: Parents Reaction
    speaker: Keiko
    dialogue:
      - "*Chuckles*"
      - Look at them, Haruma.
      - They already have their little private secrets.
  - background: Haruma Eyeing Them
    speaker: Haruma
    dialogue:
      - Eight months together... and you didn't know where Yuki grew up?
