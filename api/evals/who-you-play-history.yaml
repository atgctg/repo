name: who-you-play-history
description: The user keeps playing the character whose lines they wrote before.
world: ship
events:
  - type: input
    text: 'Juno, plot a course for Kessler Station.'
  - type: dialogue
    background: Bridge Wide
    speaker: Juno
    caption: Course laid in, Captain. Six hours.
  - type: input
    text: 'Tal, how are the engines holding up?'
  - type: dialogue
    background: Engine Room
    speaker: Tal
    caption: She's rattling, but she'll get us there.
input:
  text: Good. Nobody sleeps until we dock.
