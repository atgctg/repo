name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event.action != 'closed' }}

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PREVIEW: pr-${{ github.event.pull_request.number }}

jobs:
  check:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test

  preview:
    needs: check
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - id: api
        working-directory: api
        run: |
          set -o pipefail
          bunx wrangler preview --name "$PREVIEW" --json | sed -n '/^{/,$p' > preview.json
          echo "url=$(jq -er '.preview.urls[0]' preview.json)" >> "$GITHUB_OUTPUT"
      - run: bun run build
        working-directory: web
      - id: web
        working-directory: web
        run: |
          set -o pipefail
          bunx wrangler preview --name "$PREVIEW" --var "API_URL:${{ steps.api.outputs.url }}" --json | sed -n '/^{/,$p' > preview.json
          echo "url=$(jq -er '.preview.urls[0]' preview.json)" >> "$GITHUB_OUTPUT"
          echo "deployment=$(jq -er '.deployment.urls[0]' preview.json)" >> "$GITHUB_OUTPUT"
      - run: curl --fail --silent --show-error --output /dev/null "${{ steps.web.outputs.url }}"
      - name: Comment preview URLs
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          body="Preview: ${{ steps.web.outputs.url }}
          API: ${{ steps.api.outputs.url }}
          This deploy: ${{ steps.web.outputs.deployment }} (${{ github.event.pull_request.head.sha }})"
          if ! git diff --quiet "$BASE" HEAD -- api/drizzle api/src/schema.ts; then
            body="$body

          This branch changes the database schema. Previews share the production database and never run migrations; they run on \`main\` after merge."
          fi
          gh pr comment "${{ github.event.pull_request.number }}" --edit-last --create-if-none --body "$body"

  cleanup:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx wrangler preview delete --name "$PREVIEW" --skip-confirmation || true
        working-directory: web
      - run: bunx wrangler preview delete --name "$PREVIEW" --skip-confirmation || true
        working-directory: api
