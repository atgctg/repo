  - type: image
    name: Orbital Tether Valley
    prompt:
      Composition: Vertical wide landscape shot. Vast bright cerulean blue sky fills
        upper frame. Flat golden yellow grass plain in foreground.
      Environment: Sunlit golden yellow meadow in foreground. Light blue river with
        pale gravel banks in midground. Steep green mountain ridges flank
        valley. Distant rocky peak with snow patch.
      Sky: Vivid azure blue sky. Massive vertical semi-transparent sky beam or space
        elevator ribbon ascends straight into high atmosphere. Puffy white
        cumulus cloud sits on mountain ridge.
      Style: Painterly digital concept art, speedpaint style. Broad visible
        brushstrokes, bold color shapes, flat graphic marks. Saturated cerulean
        blue, warm yellow, olive green, crisp white. No photorealism, no 3D
        render sheen.
      Subjects: Futuristic white robot lander with cylindrical body, wide mushroom
        domed cap, articulated robotic legs with grey joints, subtle red stripe
        on side. Solitary traveler in dark clothes and wide-brim dark hat rests
        on grass leaning against robot leg.
