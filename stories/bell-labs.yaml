    attributes:
      Info:
        Name: Dennis MacAlistair Ritchie
        Role: Computer Scientist
        Affiliation: Bell Labs
        Education: Harvard University
      Accomplishments:
        Key:
          - Created the C programming language
          - Co-developed the Unix operating system
          - Co-authored "The C Programming Language" (K&R)
        Awards:
          - Turing Award (1983)
          - National Medal of Technology (1999)
          - Japan Prize (2011)
      Legacy:
        Impact: Foundational figure in modern software and operating system design
