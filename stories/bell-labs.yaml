assets:
  - name: Bell Labs Building
    kind: image
    prompt:
      Description: A striking mid-century modern building with clean geometric lines
        and large glass windows. The exterior features a mix of concrete, steel,
        and glass, with the iconic Bell Labs logo prominently displayed. The
        building sits in a well-maintained campus setting with manicured lawns
        and walking paths.
    createdAt: 2026-09-15T14:24:29.991Z
  - name: Bell Labs Interior
    kind: image
    prompt:
      Description: A mid-century modern research laboratory with clean lines and
        minimalist design. Large windows let in natural light, illuminating rows
        of vintage computers and oscilloscopes. Scientists in white lab coats
        work at long tables covered in schematics and equipment.
    createdAt: 2026-09-15T14:24:35.229Z
  - name: Dennis Ritchie
    kind: image
    prompt:
      Description: A young computer scientist with short dark hair and glasses,
        wearing a white lab coat over a button-down shirt and tie. He's standing
        at a terminal, typing on a keyboard, surrounded by stacks of paper and
        technical manuals. The background shows the clean, modern Bell Labs
        interior.
    createdAt: 2026-09-15T14:24:40.045Z
