    attributes:
      Style: Ghibli-adjacent night illustration
      Palette: Amber lanterns, wet asphalt blue, a little neon magenta
      Texture: Soft grain, rain sheen
      Brushwork: Clear shapes, gentle glow, not photoreal
    createdAt: 2026-09-15T20:50:00.000Z
    updatedAt: 2026-09-15T20:50:00.000Z
