  - type: dialogue
    background: Botanist greeting traveler
    speaker: Botanist
    caption: |-
      Hello there!
      *adjusts goggles on forehead with a gentle smile*
      Just checking soil nodules along the river plain.
      The nitrogen cycle is shifting toward the elevator base.
  - type: image
    name: Traveler inquiring
  - type: dialogue
    background: Traveler inquiring
    speaker: Traveler
    caption: |-
      Is that bad?
      *tilts dark hat, leaning gently on the staff*
      And what exactly is a meadow?
  - type: image
    name: Botanist explaining cable
  - type: dialogue
    background: Botanist explaining cable
    speaker: Botanist
    caption: |-
      *chuckles softly and points across the plain*
      The wild grassland right beneath our boots.
      That ribbon carries power down and climbers up.
      Thirty-six thousand kilometers to orbit.
  - type: image
    name: Traveler amazed
  - type: dialogue
    background: Traveler amazed
    speaker: Traveler
    caption: |-
      It is an elevator to the stars...
      *eyes wide under brim of the hat*
      Whoa. That is incredible.
  - type: image
    name: Botanist sharing tea
  - type: dialogue
    background: Botanist sharing tea
    speaker: Botanist
    caption: |-
      *pours steamy tea into a small metal cup*
      Grows on you once you have lived under it awhile.
      Here, warm mountain mint and dandelion.
      You look like you walked halfway across the basin.
assets:
  - name: solarpunk-robot-plain
    createdAt: 2026-09-20T12:25:54.678Z
    kind: image
    prompt:
      Composition: Vertical wide landscape perspective, front view from screen perspective
      Environment: Vast bright cerulean sky above a flat golden yellow grass plain;
        sunlit meadow in the foreground; winding light blue river bordered by
        pale gravel banks in the midground; steep green mountain ridges framing
        the valley leading to a distant rocky peak with a patch of snow; puffy
        white cumulus cloud resting on the mountain ridge; massive
        semi-transparent orbital elevator ribbon sky beam ascending straight up
        vertically through the sky
      Subject: Futuristic white robot lander with a cylindrical body, a wide
        mushroom-shaped dome, and articulated legs with grey joints, standing
        alone on the grass plain (screen-right, facing screen-left toward the
        river and mountains). Solitary machine with no humans present.
  - name: Solar Canopy Camp
